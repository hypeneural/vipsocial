#:schema https://developers.openai.com/codex/config-schema.json

# Project-scoped Codex defaults for VIPSocial Hub.
# Codex only loads this file after the project is trusted.

model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 32768
web_search = "cached"

[features]
codex_hooks = true
multi_agent = true
shell_snapshot = true

[agents]
max_threads = 3
max_depth = 1
